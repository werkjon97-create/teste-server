name: Ubuntu RDP Environment

on:
  workflow_dispatch: # لتشغيل البيئة يدوياً في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # أقصى مدة لتشغيل الـ Runner هي 6 ساعات

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Desktop Environment & xRDP
        run: |
          sudo apt update
          sudo apt install -y xfce4 xfce4-goodies xrdp
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp

      - name: Create RDP User & Set Password
        run: |
          # 1. إنشاء مستخدم جديد باسم rdpuser
          sudo useradd -m -s /bin/bash rdpuser
          
          # 2. تعيين كلمة السر المأخوذة من الـ Secret
          echo "rdpuser:${{ secrets.USER_PASSWORD }}" | sudo chpasswd
          
          # 3. إعطاء المستخدم صلاحيات الأدمن (sudo)
          sudo usermod -aG sudo rdpuser
          
          # 4. ضبط واجهة XFCE للمستخدم الجديد
          echo "xfce4-session" | sudo tee /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Keep Server Alive
        run: |
          echo "=========================================="
          echo "RDP Server is READY!"
          echo "Connect via your Tailscale IP on Port 3389"
          echo "Username: rdpuser"
          echo "=========================================="
          # الحفاظ على السيرفر شغالاً لمدة 6 ساعات
          sleep 21600
