name: Ubuntu SSH Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Force Clean Repos & Fast Update
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 1. إزالة كافة ملفات المصادر القديمة المسببة للبطء
          sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/*

          # 2. إضافة المصادر الرسمية المباشرة
          echo "deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list

          # 3. تحديث قائمة الحزم وتثبيت OpenSSH
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout="10"
          sudo apt-get install -y openssh-server

          # 4. تشغيل خدمة SSH
          sudo systemctl enable ssh
          sudo systemctl restart ssh

      - name: Create SSH User & Set Password
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:${{ secrets.USER_PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Keep Server Alive & Display IP
        run: |
          echo "=========================================="
          echo "Checking SSH Service Status:"
          sudo systemctl status ssh --no-pager || true
          echo "------------------------------------------"
          echo "Your Tailscale IP is:"
          SSH_IP=$(tailscale ip -4 || true)
          echo "$SSH_IP"
          echo "------------------------------------------"
          echo "Connect via SSH:"
          echo "ssh rdpuser@$SSH_IP"
          echo "=========================================="
          sleep 21600
