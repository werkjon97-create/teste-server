name: Build and Setup Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Fix APT Mirrors & Update Fast
        run: |
          # 1. استبدال المرايا البطئية بالمستودع الرسمي السريع
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list || true
          
          # 2. تحديث الحزم بسرعة مع تحديد مهلة زمنية للمنع من التجمّد
          sudo apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout="10"

      - name: Install Base Packages
        run: |
          # 3. تثبيت الأدوات الأساسية المطلوبة
          sudo apt-get install -y --no-install-recommends \
            curl \
            wget \
            git \
            unzip

      - name: Environment Ready
        run: |
          echo "✅ تم تجهيز البيئة بنجاح وبسرعة دون التعليق في apt update!"
