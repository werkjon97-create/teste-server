name: Ubuntu RDP Environment

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast Install Desktop Environment & xRDP
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends xfce4 xfce4-goodies xrdp
          sudo adduser xrdp ssl-cert
          sudo systemctl restart xrdp

      - name: Create RDP User & Set Password
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo "rdpuser:${{ secrets.USER_PASSWORD }}" | sudo chpasswd
          sudo usermod -aG sudo rdpuser
          echo "xfce4-session" | sudo tee /home/rdpuser/.xsession
          sudo chown rdpuser:rdpuser /home/rdpuser/.xsession

      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Keep Server Alive & Display IP
        run: |
          echo "=========================================="
          echo "RDP Server Status:"
          tailscale status || true
          echo "------------------------------------------"
          echo "Your Tailscale IP is:"
          tailscale ip -4 || true
          echo "------------------------------------------"
          echo "Username: rdpuser"
          echo "=========================================="
          sleep 21600
